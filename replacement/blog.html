<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rin Saito's notes on algorithms, optimization, and related topics.">
  <meta name="theme-color" content="#0c7bbb">
  <title>Rin's Notes</title>
  <link rel="stylesheet" href="blog.css">

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="blog.js" defer></script>
</head>

<body>
  <button
    id="hamburger"
    type="button"
    aria-controls="sidebar"
    aria-expanded="false"
    aria-label="メニューを開く"
  >☰</button>

  <div class="container">
    <aside class="sidebar" id="sidebar" aria-label="ブログナビゲーション">
      <h2>タグ</h2>
      <ul id="tagList"></ul>

      <h2>記事一覧</h2>
      <ul id="articleList"></ul>

      <footer>
        <a href="index.html" class="no-underline">← ホームへ戻る</a>
      </footer>
    </aside>

    <main class="content">
      <div id="articleContent" aria-live="polite">
        <p>記事を読み込んでいます。</p>
      </div>
    </main>
  </div>
</body>

</html>
