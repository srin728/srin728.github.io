name: Build static pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check generator syntax
        run: |
          python -m py_compile \
            scripts/build_homepage.py \
            scripts/build_blog.py \
            scripts/build_supplement.py \
            scripts/build_site_meta.py \
            scripts/site_utils.py

      - name: Build homepage
        run: python scripts/build_homepage.py

      - name: Build blog
        run: python scripts/build_blog.py

      - name: Build supplement
        run: python scripts/build_supplement.py

      - name: Build site metadata
        run: python scripts/build_site_meta.py

      - name: Verify generated pages
        run: |
          python scripts/build_homepage.py --check
          python scripts/build_blog.py --check
          python scripts/build_supplement.py --check
          python scripts/build_site_meta.py --check

      - name: Commit generated pages
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Generated pages are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html ja.html blog.html supplement.html supplement-talks.html supplement-updates.html notes/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Rebuild static pages [skip ci]"
          git push
